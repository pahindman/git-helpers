repos:
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    exclude: '^LICENSE$'
- repo: local
  hooks:
  - id: manpage-syntax
    name: Man page syntax check
    entry: sh -c 'for file do groff -man -Tutf8 -z "$file" >/dev/null; done' --
    language: system
    files: '^man/.*$'
  - id: relevant-bats-tests
    name: Run Relevant Bats Tests
    entry: test/bats-precommit-wrapper
    language: node
    # This tells pre-commit to install bats automatically
    additional_dependencies:
      - bats@1.11.0
    pass_filenames: true
